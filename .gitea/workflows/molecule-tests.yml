---
name: Molecule Tests

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  molecule-tests:
    runs-on: fedora-latest
    steps:
      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITEA_PATH"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ansible_role_mail

      - name: Install Molecule
        run: pip install ansible molecule molecule-plugins[podman]

      - name: Install Ansible collections
        run: ansible-galaxy collection install containers.podman

      - name: Run Molecule tests
        working-directory: ansible_role_mail
        run: molecule test

      - name: Tag latest
        if: github.ref == 'refs/heads/main'
        working-directory: ansible_role_mail
        run: |
          git config user.name "giabot"
          git config user.email "bot@mail.gianet.us"
          git remote set-url origin "https://giabot:${{ secrets.GITEA_TOKEN }}@gianet.us/engineering/ansible_role_mail.git"
          git tag -f latest
          git push -f origin latest

      # This step will ONLY run if any of the previous steps failed
      - name: Notify on Failure
        if: failure()
        # if: always()
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: mail.gianet.us
          server_port: 2525
          ignore_cert: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Scheduled workflow "${{ gitea.workflow }}" has failed
          to: infrastructure+actions@gianet.us
          from: "Gitea Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            The job was automatically triggered by a ${{ gitea.event_name }} event
            View the run here: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_number }}
            